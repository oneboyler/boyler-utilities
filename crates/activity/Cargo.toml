[package]
name = "bu-activity"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Boyler Utilities - Activity tab features (which app is in front, game time, uptime, today / 7 days, stored locally). No UI."

[[example]]
name = "activity-show"
path = "examples/show.rs"

[[example]]
name = "activity-watch"
path = "examples/watch.rs"

[dependencies]
thiserror = "2"
# Order 048: the process's one Raw Input owner (the first-input message after idle)
bu-rawin = { path = "../rawin" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
