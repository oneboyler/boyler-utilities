[package]
name = "bu-voice"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Boyler Utilities - Voice to text: Windows' online dictation (the speech service Windows' own voice typing, Win+H, uses), the words as they come, copy to the clipboard. No UI, no keys."

# example names must be unique across the workspace (every examples/show.rs would build to the same show.exe — LNK1104)
[[example]]
name = "voice-show"
path = "examples/show.rs"

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Media_SpeechRecognition",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
