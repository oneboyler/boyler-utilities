[package]
name = "bu-voice"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Boyler Utilities - Voice to text through Windows' own voice typing (Win+H), sent only to our own focused window; copy to the clipboard. No UI, no keys of its own."

# example names must be unique across the workspace (every examples/show.rs would build to the same show.exe — LNK1104)
[[example]]
name = "voice-show"
path = "examples/show.rs"

[[example]]
name = "voice-live"
path = "examples/live.rs"

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
