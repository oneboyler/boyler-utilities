[package]
name = "bu-screenshot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Boyler Utilities - the Screenshots engine (DESIGN.md 3.3): capture, clipboard / PNG output, gallery index. No UI, no overlay."

[dependencies]
thiserror = "2"
png = "0.18"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Metadata",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Security_Authorization_AppCapabilityAccess",
    "Win32_Devices_Display",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies.windows-core]
version = "0.62"

[target.'cfg(windows)'.dependencies.windows-future]
version = "0.3"

# example names must be unique across the workspace (every examples/show.rs would build to the same show.exe - LNK1104)
[[example]]
name = "screenshot-show"
path = "examples/show.rs"

[[example]]
name = "screenshot-proof"
path = "examples/proof.rs"
