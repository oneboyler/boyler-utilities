[package]
name = "bu-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Boyler Utilities - Storage tab features (drives, what uses the space, clean up, drive health). No UI."

[[example]]
name = "storage-show"
path = "examples/show.rs"

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Ole",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
]
