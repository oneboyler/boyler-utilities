[package]
name = "bu-quickfix"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Boyler Utilities - Quick fixes (DESIGN.md 3.5): reset graphics driver, repair Windows files (DISM + sfc), rebuild icon & thumbnail cache, make a restore point. No UI."

# example names must be unique across the workspace (every examples/show.rs would build to the same show.exe — LNK1104)
[[example]]
name = "quickfix-show"
path = "examples/show.rs"

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Restore",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
