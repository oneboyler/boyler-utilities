[package]
name = "bu-security"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Boyler Utilities - Security tab features (a simple front for Microsoft Defender: status, scans, threats, quarantine). No UI."

[[example]]
name = "security-show"
path = "examples/show.rs"

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
