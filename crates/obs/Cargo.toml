[package]
name = "bu-obs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Boyler Utilities - Notifications for OBS engine (Order 035, a port of NotificationsForOBS): obs-websocket v5 client, OBS config + profile files, the event / key state machine, sounds. No UI."

[[example]]
name = "obs-show"
path = "examples/show.rs"

[dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
