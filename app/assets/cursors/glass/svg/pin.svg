<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32" width="32" height="32" data-hotspot="2.6 2.2">
  <!-- Boyler Utilities "Glass" cursor set: Location select (Pin): the arrow + a blue glass map pin. Hotspot: the arrow's tip (like Windows' own).
       Style: a frosted, partly see-through white glass body, a crisp white rim (1 unit inside the edge), a thin dark line
       (1 unit outside it) so it reads on light and dark, a soft top highlight and a soft drop shadow. 32-unit grid; the tool
       (tools/cursorgen) renders it at 32 / 48 / 64 / 96 / 128 px. data-hotspot = the click point in grid units. -->
  <defs>
    <filter id="shadow" x="-8" y="-8" width="48" height="48" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="0.9"/></filter>
    <filter id="soft" x="-8" y="-8" width="48" height="48" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="0.8"/></filter>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="29">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf2fa"/>
    </linearGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="29">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".93"/>
      <stop offset=".55" stop-color="#eaf0f9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#d3dff1" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb1ff" stop-opacity=".96"/><stop offset="1" stop-color="#0a6cf0" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5c5c" stop-opacity=".97"/><stop offset="1" stop-color="#d4141c" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aafff"/><stop offset="1" stop-color="#0b6cf2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2=".7" y2=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="A" d="M3 3V19L7 15.3L9.6 21.2L12.4 20L9.9 14.3H14.6Z" fill-rule="evenodd" clip-rule="evenodd"/>
    <path id="A-hull" d="M3 3V19L7 15.3L9.6 21.2L12.4 20L9.9 14.3H14.6Z"/>
    <mask id="A-sh" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="48">
      <rect x="-8" y="-8" width="48" height="48" fill="#fff"/><use xlink:href="#A-hull" fill="#000"/>
    </mask>
    <clipPath id="A-in"><use xlink:href="#A"/></clipPath>
    <mask id="A-out" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="48">
      <rect x="-8" y="-8" width="48" height="48" fill="#fff"/><use xlink:href="#A" fill="#000"/>
    </mask>
    <mask id="A-inset" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="48">
      <use xlink:href="#A" fill="#fff"/><use xlink:href="#A" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    </mask>
    <path id="B" d="M22 28.6C20.6 26.4 17.4 23.6 17.4 20A4.6 4.6 0 0 1 26.6 20C26.6 23.6 23.4 26.4 22 28.6Z" fill-rule="evenodd" clip-rule="evenodd"/>
    <path id="B-hull" d="M22 28.6C20.6 26.4 17.4 23.6 17.4 20A4.6 4.6 0 0 1 26.6 20C26.6 23.6 23.4 26.4 22 28.6Z"/>
    <mask id="B-sh" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="48">
      <rect x="-8" y="-8" width="48" height="48" fill="#fff"/><use xlink:href="#B-hull" fill="#000"/>
    </mask>
    <clipPath id="B-in"><use xlink:href="#B"/></clipPath>
    <mask id="B-out" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="48">
      <rect x="-8" y="-8" width="48" height="48" fill="#fff"/><use xlink:href="#B" fill="#000"/>
    </mask>
    <mask id="B-inset" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="48">
      <use xlink:href="#B" fill="#fff"/><use xlink:href="#B" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#A-sh)"><use xlink:href="#A-hull" transform="translate(0 1)" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round" opacity=".34" filter="url(#shadow)"/></g>
  <use xlink:href="#A" mask="url(#A-out)" fill="none" stroke="#0c111c" stroke-opacity=".8" stroke-width="2" stroke-linejoin="round"/>
  <g mask="url(#A-inset)">
    <use xlink:href="#A" fill="url(#body)"/>
    <use xlink:href="#A" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="3.2" stroke-linejoin="round" filter="url(#soft)"/>
    <use xlink:href="#A" fill="url(#gloss)" opacity="1"/>
  </g>
  <use xlink:href="#A" fill="none" stroke="url(#rim)" stroke-width="2" stroke-linejoin="round" clip-path="url(#A-in)"/>
  <g mask="url(#B-sh)"><use xlink:href="#B-hull" transform="translate(0 1)" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round" opacity=".34" filter="url(#shadow)"/></g>
  <use xlink:href="#B" mask="url(#B-out)" fill="none" stroke="#0c111c" stroke-opacity=".8" stroke-width="2" stroke-linejoin="round"/>
  <g mask="url(#B-inset)">
    <use xlink:href="#B" fill="url(#blue)"/>
    <use xlink:href="#B" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="3.2" stroke-linejoin="round" filter="url(#soft)"/>
    <use xlink:href="#B" fill="url(#gloss)" opacity=".55"/>
  </g>
  <use xlink:href="#B" fill="none" stroke="url(#rim)" stroke-width="2" stroke-linejoin="round" clip-path="url(#B-in)"/>
  <g clip-path="url(#B-in)"><circle cx="22" cy="20" r="1.7" fill="#fff"/></g>
</svg>
