<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 32 32" width="32" height="32" data-hotspot="16 16">
  <!-- Boyler Utilities "Glass" cursor set: Busy (Wait, animated): a glass ring with a blue arc turning in it. Hotspot: the centre. The arc (data-spin = cx cy r min max) is set per frame by the tool.
       Style: a frosted, partly see-through white glass body, a crisp white rim (1 unit inside the edge), a thin dark line
       (1 unit outside it) so it reads on light and dark, a soft top highlight and a soft drop shadow. 32-unit grid; the tool
       (tools/cursorgen) renders it at 32 / 48 / 64 / 96 / 128 px. data-hotspot = the click point in grid units. -->
  <defs>
    <filter id="shadow" x="-8" y="-8" width="48" height="48" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="0.9"/></filter>
    <filter id="soft" x="-8" y="-8" width="48" height="48" filterUnits="userSpaceOnUse"><feGaussianBlur stdDeviation="0.8"/></filter>
    <linearGradient id="rim" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="29">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#edf2fa"/>
    </linearGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="0" y1="3" x2="0" y2="29">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".93"/>
      <stop offset=".55" stop-color="#eaf0f9" stop-opacity=".8"/>
      <stop offset="1" stop-color="#d3dff1" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fb1ff" stop-opacity=".96"/><stop offset="1" stop-color="#0a6cf0" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5c5c" stop-opacity=".97"/><stop offset="1" stop-color="#d4141c" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aafff"/><stop offset="1" stop-color="#0b6cf2"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2=".7" y2=".7">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".75"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="R" d="M5.5 16A10.5 10.5 0 1 1 26.5 16A10.5 10.5 0 1 1 5.5 16ZM10.5 16A5.5 5.5 0 1 0 21.5 16A5.5 5.5 0 1 0 10.5 16Z" fill-rule="evenodd" clip-rule="evenodd"/>
    <path id="R-hull" d="M5.5 16A10.5 10.5 0 1 1 26.5 16A10.5 10.5 0 1 1 5.5 16Z"/>
    <mask id="R-sh" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="48">
      <rect x="-8" y="-8" width="48" height="48" fill="#fff"/><use xlink:href="#R-hull" fill="#000"/>
    </mask>
    <clipPath id="R-in"><use xlink:href="#R"/></clipPath>
    <mask id="R-out" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="48">
      <rect x="-8" y="-8" width="48" height="48" fill="#fff"/><use xlink:href="#R" fill="#000"/>
    </mask>
    <mask id="R-inset" maskUnits="userSpaceOnUse" x="-8" y="-8" width="48" height="48">
      <use xlink:href="#R" fill="#fff"/><use xlink:href="#R" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#R-sh)"><use xlink:href="#R-hull" transform="translate(0 1)" fill="#000" stroke="#000" stroke-width="2" stroke-linejoin="round" opacity=".34" filter="url(#shadow)"/></g>
  <use xlink:href="#R" mask="url(#R-out)" fill="none" stroke="#0c111c" stroke-opacity=".8" stroke-width="2" stroke-linejoin="round"/>
  <g mask="url(#R-inset)">
    <use xlink:href="#R" fill="url(#body)"/>
    <use xlink:href="#R" fill="none" stroke="#ffffff" stroke-opacity=".75" stroke-width="3.2" stroke-linejoin="round" filter="url(#soft)"/>
    <circle data-spin="16 16 8 .22 .55" cx="16" cy="16" r="8" fill="none" stroke="url(#liquid)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="11 100.5" transform="rotate(-130 16 16)"/>
    <use xlink:href="#R" fill="url(#gloss)" opacity="1"/>
  </g>
  <use xlink:href="#R" fill="none" stroke="url(#rim)" stroke-width="2" stroke-linejoin="round" clip-path="url(#R-in)"/>
</svg>
